[workspace]
resolver = "2"
# aicraft-ui 刻意不放进 workspace。
#
# 原因：workspace 的依赖解析是全局的，只要有一个成员引用 eframe，
# `cargo build -p aicraft-core --offline` 也会因为找不到 eframe 而失败。
# 把 UI 拆出去之后，core 与 cli 保持「零依赖、离线可构建」这一性质 ——
# 这是本项目最重要的工程约束，不该为了目录整齐而牺牲。
members = ["crates/aicraft-core", "crates/aicraft-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 唯一一处对体积的例外：core 是热路径所在（SHA-1 校验、版本 JSON 解析），
# 而 "z" 会为了少几个字节放弃循环优化。实测把 core 单独提到 2：
# 本机 1198 个 jar 的全量 SHA-1 从 5.49 秒降到 4.38 秒，exe 只大 314 KB。
# 其余 crate 仍是 "z" —— 体积的大头在 UI 的 egui 上，那里优化速度没有意义。
[profile.release.package.aicraft-core]
opt-level = 2
